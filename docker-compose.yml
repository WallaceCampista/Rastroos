# ─────────────────────────────────────────────────────────────
# Rastro$ — Docker Compose (dev)
# ─────────────────────────────────────────────────────────────
# Sobe o PostgreSQL para desenvolvimento local.
# Configuração vem de variáveis em .env (cópia de .env.example).
#
# Comandos:
#   docker compose up -d postgres        # sobe em background
#   docker compose logs -f postgres      # acompanha logs
#   docker compose down                  # para (preserva volume)
#   docker compose down -v               # para + apaga volume (RESET)
# ─────────────────────────────────────────────────────────────

name: rastroos

services:
  postgres:
    image: postgres:16-alpine
    container_name: rastroos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing in .env}
      # Forçar locale UTF-8 e configurações iniciais saudáveis
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bind apenas em 127.0.0.1 — banco NUNCA exposto na rede em dev.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rastroos-pgdata:/var/lib/postgresql/data
    networks:
      - rastroos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Hardening básico para o container
    security_opt:
      - no-new-privileges:true
    # Logs com tamanho controlado
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rastroos-pgdata:
    name: rastroos-pgdata

networks:
  rastroos-net:
    name: rastroos-net
    driver: bridge
