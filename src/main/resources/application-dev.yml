# ─────────────────────────────────────────────────────────────
# Rastroo$ — perfil DEV
# ─────────────────────────────────────────────────────────────

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rastroos}
    username: ${SPRING_DATASOURCE_USERNAME:rastroos}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-in-local-env}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  liquibase:
    # DEV usa um master próprio que adiciona o seed de demonstração (005).
    # Prod/test continuam em db.changelog-master.xml (sem o usuário demo).
    change-log: classpath:/db/changelog/db.changelog-dev.xml

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false              # ligar manualmente quando precisar

  thymeleaf:
    cache: false                 # auto-reload em dev

  # Em dev o navegador sempre revalida JS/CSS/estáticos (Cache-Control: no-cache),
  # evitando rodar assets obsoletos após uma alteração. Em prod mantém-se o cache.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

server:
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,beans,loggers,mappings
  endpoint:
    health:
      show-details: always

# ── Alfredo / IA ─────────────────────────────────────────────
# DEV fala com o Gemini, e SÓ com ele: `provider-locked` desliga a troca de
# motor, então o seletor do menu do administrador aparece desabilitado aqui.
# Em produção a escolha é do administrador (OpenAI ou Gemini).
#
# A chave não mora aqui: vem de AI_GEMINI_API_KEY, definida em `.env.local`
# (não versionado) e lida pelo bloco `ai.keys` do application.yml.
#
# Modelos ficam vazios de propósito: vale o padrão do fornecedor
# (gemini-3.5-flash-lite + gemini-embedding-001, ambos em 1536 dimensões,
# que é o que a coluna vector(1536) de ai_documents espera).
ai:
  provider: gemini
  # Travado por padrão em dev. AI_PROVIDER_LOCKED=false destrava quando se
  # quer exercitar a troca localmente (exige as duas chaves configuradas).
  provider-locked: ${AI_PROVIDER_LOCKED:true}

logging:
  level:
    com.rastroos: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
