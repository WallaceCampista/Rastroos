# ─────────────────────────────────────────────────────────────
# Rastroo$ — perfil DEV
# ─────────────────────────────────────────────────────────────

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rastroos}
    username: ${SPRING_DATASOURCE_USERNAME:rastroos}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-in-local-env}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  liquibase:
    # DEV usa um master próprio que adiciona o seed de demonstração (005).
    # Prod/test continuam em db.changelog-master.xml (sem o usuário demo).
    change-log: classpath:/db/changelog/db.changelog-dev.xml

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false              # ligar manualmente quando precisar

  thymeleaf:
    cache: false                 # auto-reload em dev

  # Em dev o navegador sempre revalida JS/CSS/estáticos (Cache-Control: no-cache),
  # evitando rodar assets obsoletos após uma alteração. Em prod mantém-se o cache.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

server:
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,beans,loggers,mappings
  endpoint:
    health:
      show-details: always

# ── Alfredo / IA ─────────────────────────────────────────────
# DEV fala com o Gemini; produção continua no OpenAI (bloco `ai` do
# application.yml, alimentado por AI_PROVIDER/AI_API_KEY do orquestrador).
#
# A chave NÃO mora aqui: vem de AI_API_KEY_DEV, definida em `.env.local`
# (não versionado). Variável própria, sem cair para AI_API_KEY — mandar a
# chave da OpenAI para o Gemini só renderia 401 e abriria o circuit breaker.
#
# Modelos ficam vazios de propósito: o padrão do fornecedor escolhido vale
# (gemini-3.5-flash-lite + gemini-embedding-001, ambos em 1536 dimensões,
# que é o que a coluna vector(1536) de ai_documents espera).
ai:
  provider: ${AI_PROVIDER_DEV:gemini}
  api-key: ${AI_API_KEY_DEV:}

logging:
  level:
    com.rastroos: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
