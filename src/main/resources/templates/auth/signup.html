<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/auth-password.js}" defer></script>
</head>
<body>
<main class="auth-shell">
    <a class="auth-brand" th:href="@{/}">
        <span class="auth-brand-mark">R<span class="accent">$</span></span>
        <span>Rastro<span class="accent">$</span></span>
    </a>

    <section class="auth-card">
        <h1 class="auth-title">Criar conta</h1>
        <p class="auth-sub">Vamos te conhecer.</p>

        <form th:action="@{/auth/signup}" method="post" th:object="${signupForm}"
              class="auth-form" novalidate>
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <label>
                <span>Nome completo</span>
                <input type="text" th:field="*{name}"
                       autocomplete="name" required minlength="2" maxlength="120">
                <small th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}" class="auth-err"></small>
            </label>
            <label>
                <span>Email</span>
                <input type="email" th:field="*{email}"
                       autocomplete="email" required maxlength="180">
                <small th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}" class="auth-err"></small>
            </label>
            <label>
                <span>Senha</span>
                <div class="auth-input-wrap">
                    <input type="password" th:field="*{password}"
                           autocomplete="new-password" required minlength="8" maxlength="128">
                    <th:block th:replace="~{fragments/password-toggle :: pwdToggle}"></th:block>
                </div>
                <small class="auth-hint">
                    Mínimo 8 caracteres, com maiúscula, minúscula, dígito e caractere especial.
                </small>
                <small th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}" class="auth-err"></small>
            </label>
            <label>
                <span>Confirmar senha</span>
                <div class="auth-input-wrap">
                    <input type="password" th:field="*{passwordConfirm}"
                           autocomplete="new-password" required minlength="8" maxlength="128">
                    <th:block th:replace="~{fragments/password-toggle :: pwdToggle}"></th:block>
                </div>
                <small th:if="${#fields.hasErrors('passwordConfirm')}"
                       th:errors="*{passwordConfirm}" class="auth-err"></small>
            </label>
            <button type="submit" class="btn btn-primary">Criar conta</button>
        </form>

        <p class="auth-links">
            <a th:href="@{/(openLogin=login)}">Já tenho conta</a>
        </p>
    </section>
</main>
</body>
</html>
