<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova senha · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <a class="auth-brand" th:href="@{/}">
        <span class="auth-brand-mark">R<span class="accent">$</span></span>
        <span>Rastro<span class="accent">$</span></span>
    </a>

    <section class="auth-card">
        <h1 class="auth-title">Definir nova senha</h1>
        <p class="auth-sub">
            Cole o código que mandamos por email e escolha uma senha forte.
        </p>

        <form th:action="@{/auth/reset}" method="post" th:object="${resetForm}"
              class="auth-form" novalidate>
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <label>
                <span>Email</span>
                <input type="email" th:field="*{email}"
                       autocomplete="email" required maxlength="180">
                <small th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}" class="auth-err"></small>
            </label>
            <label>
                <span>Código</span>
                <input type="text" th:field="*{code}"
                       autocomplete="one-time-code" inputmode="numeric"
                       pattern="\d{6}" maxlength="6" required>
                <small th:if="${#fields.hasErrors('code')}"
                       th:errors="*{code}" class="auth-err"></small>
            </label>
            <label>
                <span>Nova senha</span>
                <input type="password" th:field="*{newPassword}"
                       autocomplete="new-password" required minlength="8" maxlength="128">
                <small class="auth-hint">
                    Mínimo 8 caracteres, com maiúscula, minúscula, dígito e caractere especial.
                </small>
                <small th:if="${#fields.hasErrors('newPassword')}"
                       th:errors="*{newPassword}" class="auth-err"></small>
            </label>
            <label>
                <span>Confirmar nova senha</span>
                <input type="password" th:field="*{newPasswordConfirm}"
                       autocomplete="new-password" required minlength="8" maxlength="128">
                <small th:if="${#fields.hasErrors('newPasswordConfirm')}"
                       th:errors="*{newPasswordConfirm}" class="auth-err"></small>
            </label>
            <button type="submit" class="btn btn-primary">Definir nova senha</button>
        </form>
    </section>
</main>
</body>
</html>
