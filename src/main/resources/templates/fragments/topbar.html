<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<header class="topbar" th:fragment="topbar" th:classappend="${period == null} ? 'topbar-plain' : ''">

    <div class="topbar-title" th:if="${period != null}">
        <div>
            <h1>
                <span th:text="${#strings.capitalize(#temporals.format(period.atDay(1), 'MMMM'))}">Mês</span>
                <span class="muted" th:text="${period.year}">2026</span>
                <button type="button" class="title-eye" data-toggle-hide-values aria-label="Ocultar valores">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </h1>
            <div class="topbar-sub" th:text="${topbarSub != null ? topbarSub : 'Seu dinheiro neste mês'}">
                Seu dinheiro neste mês
            </div>
        </div>
    </div>

    <div class="app-access-banner" th:if="${accessorMode}" role="status">
        <span class="app-access-dot" aria-hidden="true"></span>
        <span>Acessando os dados de <strong th:text="${accessTargetName} ?: 'titular'">titular</strong></span>
    </div>

    <th:block th:if="${period != null}">
        <div class="period-selector" th:replace="~{fragments/period-selector :: period}"></div>
    </th:block>

    <div class="topbar-actions">
        <div class="app-user-menu" th:replace="~{fragments/user-menu :: menu}"></div>
    </div>

</header>

</body>
</html>
