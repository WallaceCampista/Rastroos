<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<header class="app-topbar" th:fragment="topbar">
    <div class="app-topbar-period" th:replace="~{fragments/period-selector :: period}"></div>

    <div class="app-topbar-actions">
        <button type="button" class="app-icon-btn" data-toggle-hide-values aria-label="Ocultar valores">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>

        <div class="app-user-menu" th:replace="~{fragments/user-menu :: menu}"></div>
    </div>
</header>

</body>
</html>
