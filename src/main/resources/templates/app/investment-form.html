<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${editing ? 'Editar investimento · Rastro$' : 'Novo investimento · Rastro$'}">Investimento · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/screens/investments.css}">
    <script th:src="@{/js/screens/investment-form.js}" defer></script>
</head>
<body>
<section class="app-content screen screen-investments screen-inv-form">
    <header class="screen-header">
        <div>
            <h1 class="screen-title"
                th:text="${editing ? 'Editar investimento' : 'Novo investimento'}">Novo investimento</h1>
            <p class="screen-sub">
                Cofrinho (meta) ou ativo de renda fixa/variável.
            </p>
        </div>
        <div class="screen-actions">
            <a class="btn" th:href="@{/app/investments}">Voltar</a>
        </div>
    </header>

    <form class="inv-form card"
          th:action="${editing ? '/app/investments/' + investmentId + '/edit' : '/app/investments/new'}"
          method="post"
          th:object="${investmentForm}">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="inv-form-grid">
            <div class="field">
                <label for="kind">Tipo</label>
                <select id="kind" th:field="*{kind}" data-inv-kind>
                    <option value="PIGGY">Cofrinho</option>
                    <option value="CDI">CDB / CDI</option>
                    <option value="TREASURY">Tesouro</option>
                    <option value="LCI">LCI</option>
                    <option value="LIMITE_GARANTIDO">Limite garantido</option>
                    <option value="STOCK">Ações</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('kind')}"
                   th:errors="*{kind}">erro</p>
            </div>

            <div class="field field-wide">
                <label for="name">Nome</label>
                <input id="name" type="text" th:field="*{name}"
                       maxlength="120" required autocomplete="off">
                <p class="field-error" th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}">erro</p>
            </div>

            <div class="field">
                <label for="amount">Saldo atual (R$)</label>
                <input id="amount" type="number" step="0.01" min="0"
                       th:field="*{amount}" required>
                <p class="field-error" th:if="${#fields.hasErrors('amount')}"
                   th:errors="*{amount}">erro</p>
            </div>

            <div class="field" data-only-kind="PIGGY">
                <label for="goal">Meta (R$)</label>
                <input id="goal" type="number" step="0.01" min="0.01"
                       th:field="*{goal}">
                <p class="field-error" th:if="${#fields.hasErrors('goal')}"
                   th:errors="*{goal}">erro</p>
            </div>

            <div class="field" data-only-kind="CDI,TREASURY,LCI,LIMITE_GARANTIDO,STOCK">
                <label for="rateLabel">Rentabilidade (texto)</label>
                <input id="rateLabel" type="text" th:field="*{rateLabel}"
                       maxlength="60" placeholder="ex.: 105% CDI">
            </div>

            <div class="field" data-only-kind="CDI,TREASURY,LCI,LIMITE_GARANTIDO,STOCK">
                <label for="monthlyReturn">Rend. mensal estimado (R$)</label>
                <input id="monthlyReturn" type="number" step="0.01" min="0"
                       th:field="*{monthlyReturn}">
            </div>

            <div class="field">
                <label for="colorHex">Cor</label>
                <input id="colorHex" type="text" th:field="*{colorHex}"
                       maxlength="80" placeholder="#6366f1">
            </div>

            <div class="field">
                <label for="iconText">Ícone (texto)</label>
                <input id="iconText" type="text" th:field="*{iconText}"
                       maxlength="8" placeholder="🐷">
                <p class="field-error" th:if="${#fields.hasErrors('iconText')}"
                   th:errors="*{iconText}">erro</p>
            </div>
        </div>

        <footer class="inv-form-foot">
            <button type="submit" class="btn btn-primary"
                    th:text="${editing ? 'Salvar' : 'Criar investimento'}">Salvar</button>
        </footer>
    </form>
</section>
</body>
</html>
