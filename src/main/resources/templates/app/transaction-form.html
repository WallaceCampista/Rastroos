<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout/base :: layout(~{::title}, ~{::head/link}, ~{::section}, ~{::head/script})}">
<head>
    <title th:text="${editing ? 'Editar lançamento · Rastro$' : 'Lançar gasto · Rastro$'}">Lançamento · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/screens/expenses.css}">
</head>
<body>
<section class="app-content screen screen-expenses screen-tx-form">
    <header class="screen-header">
        <div>
            <h1 class="screen-title"
                th:text="${editing ? 'Editar lançamento' : 'Lançar gasto'}">Lançar gasto</h1>
            <p class="screen-sub">Despesa pontual, recorrente ou parcelada.</p>
        </div>
        <div class="screen-actions">
            <a class="btn" th:href="@{/app/expenses}">Voltar</a>
        </div>
    </header>

    <form class="form tx-form"
          th:action="${editing ? '/app/expenses/' + transactionId + '/edit' : '/app/expenses/new'}"
          method="post"
          th:object="${transactionForm}"
          th:attr="data-extract-url=@{/app/expenses/extract}">
        <input type="hidden" th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- Aviso da extração por documento/foto (aparece só após importar) -->
        <div class="tx-extract-note" th:if="${extracted}"
             th:classappend="${extractDemo} ? 'is-demo' : ''">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4L12 3zM5 17l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z"/>
            </svg>
            <span th:if="${extractDemo}" th:text="#{transaction.extract.demoNote}">Confira e preencha os dados.</span>
            <span th:unless="${extractDemo}" th:text="#{transaction.extract.note}">Confira os dados extraídos.</span>
        </div>
        <div class="tx-extract-note is-error" th:if="${extractError}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
            </svg>
            <span th:text="${extractError}">Erro no arquivo.</span>
        </div>
        <div class="tx-extract-note is-loading" data-extract-loading hidden>
            <span class="tx-extract-spinner" aria-hidden="true"></span>
            <span>Lendo o arquivo…</span>
        </div>
        <div class="tx-extract-note is-error" data-extract-error hidden></div>

        <div class="form-tabs tx-method-bar" data-tx-tabs>
            <button type="button" class="form-tab" data-tx-tab="variable">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2V3zm3 5h8m-8 4h8m-8 4h5"/>
                </svg>
                Gasto variável
            </button>
            <button type="button" class="form-tab" data-tx-tab="fixed">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                </svg>
                Gasto fixo
            </button>
            <th:block th:unless="${editing}">
                <span class="tx-method-sep" aria-hidden="true"></span>
                <button type="button" class="form-tab form-tab-action" data-tx-extract="document"
                        title="Importar documento" aria-label="Importar documento (boleto, fatura, comprovante)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <button type="button" class="form-tab form-tab-action" data-tx-extract="receipt"
                        title="Foto da notinha" aria-label="Tirar foto da notinha do cartão">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </button>
            </th:block>
        </div>

        <th:block th:unless="${editing}">
            <input type="file" data-extract-file="document"
                   accept=".pdf,image/png,image/jpeg,image/webp" hidden>
            <input type="file" data-extract-file="receipt"
                   accept="image/*" capture="environment" hidden>
        </th:block>

        <input type="checkbox" th:field="*{fixed}" hidden>
        <span class="form-hint" data-tx-hint>Gasto pontual como alimentação, combustível, compras.</span>

        <label>
            <span>Descrição</span>
            <input class="input" type="text" th:field="*{description}"
                   maxlength="200" required autocomplete="off" placeholder="Ex: Almoço iFood">
            <small th:if="${#fields.hasErrors('description')}" th:errors="*{description}"
                   class="form-hint form-hint-err"></small>
        </label>

        <div class="form-row">
            <label>
                <span>Valor (R$)</span>
                <input class="input" type="number" step="0.01" min="0.01"
                       th:field="*{amount}" required placeholder="0,00">
                <small th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"
                       class="form-hint form-hint-err"></small>
            </label>
            <label>
                <span>Vencimento</span>
                <input class="input" type="date" th:field="*{dueDate}" required>
                <small th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"
                       class="form-hint form-hint-err"></small>
            </label>
        </div>

        <label th:unless="${editing}">
            <span>Parcelas</span>
            <input class="input" id="installments" type="number" min="1" max="60"
                   th:field="*{installments}">
            <small class="form-hint field-help">1 = pagamento único. Acima disso, o valor é o
                total da compra, dividido nas parcelas a partir do mês seguinte.</small>
            <small th:if="${#fields.hasErrors('installments')}" th:errors="*{installments}"
                   class="form-hint form-hint-err"></small>
        </label>

        <label>
            <span>Conta</span>
            <select class="input" th:field="*{accountId}" required>
                <option value="" disabled>Selecione…</option>
                <option th:each="a : ${accountOptions}" th:value="${a.id}" th:text="${a.name}">Conta</option>
            </select>
            <small th:if="${#fields.hasErrors('accountId')}" th:errors="*{accountId}"
                   class="form-hint form-hint-err"></small>
        </label>

        <label>
            <span>Categoria</span>
            <div class="cat-grid" data-cat-grid>
                <button type="button" class="cat-btn" th:each="c : ${categoryOptions}"
                        th:attr="data-cat=${c.id},data-color=${c.colorHex}">
                    <span class="cat-dot"></span>
                    <span th:text="${c.namePt}">Categoria</span>
                </button>
            </div>
            <input type="hidden" th:field="*{categoryId}" data-cat-input>
            <small th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"
                   class="form-hint form-hint-err"></small>
        </label>

        <label class="check-row">
            <input type="checkbox" th:field="*{paid}">
            <span>Já está pago</span>
        </label>

        <div class="form-actions">
            <a class="btn btn-ghost" data-modal-close th:href="@{/app/expenses}">Cancelar</a>
            <button type="submit" class="btn btn-primary"
                    th:text="${editing ? 'Salvar alterações' : 'Lançar gasto'}">Lançar gasto</button>
        </div>
    </form>
</section>
</body>
</html>
