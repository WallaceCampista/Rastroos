<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Excluir lançamento · Rastroo$</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/screens/cards.css}">
</head>
<body>
<!-- modals.js abre [data-modal-content] num modal central (openNode). -->
<div class="app-content">
    <div class="acct-del" data-modal-content>

        <header class="acct-del-head">
            <h3 class="acct-del-title">Excluir “<span th:text="${del.description()}">Lançamento</span>”</h3>
            <button type="button" class="icon-btn" data-modal-close aria-label="Fechar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6"/></svg>
            </button>
        </header>

        <p class="acct-del-sub" th:if="${del.hasSeries() and del.installment()}">
            Esta é a parcela <strong th:text="${del.installmentLabel()}">3/10</strong> de uma compra com
            <strong th:text="${del.seriesTotal()}">0</strong> parcela(s) lançadas. Escolha o que apagar.
        </p>
        <p class="acct-del-sub" th:if="${del.hasSeries() and !del.installment()}">
            Este gasto se repete em <strong th:text="${del.seriesTotal()}">0</strong> mês(es).
            Escolha o que apagar.
        </p>
        <p class="acct-del-sub" th:unless="${del.hasSeries()}">
            Lançamento de <span th:text="${#temporals.format(del.dueDate(), 'dd/MM/yyyy')}">01/01/2026</span>.
            Apagar remove só ele.
        </p>

        <div class="acct-del-options">
            <form method="post" th:action="@{/app/expenses/{id}/delete(id=${del.id()})}">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="scope" value="ONE">
                <input type="hidden" name="from" value="cards" th:if="${fromCards}">
                <button type="submit" class="acct-del-opt" th:classappend="${del.hasSeries()} ? '' : 'is-danger'">
                    <span class="acct-del-opt-title">
                        <th:block th:if="${del.hasSeries() and del.installment()}">Só esta parcela</th:block>
                        <th:block th:if="${del.hasSeries() and !del.installment()}">Só este mês</th:block>
                        <th:block th:unless="${del.hasSeries()}">Apagar</th:block>
                    </span>
                    <span class="acct-del-opt-sub">
                        Remove o lançamento de
                        <span th:text="${#temporals.format(del.dueDate(), 'dd/MM/yyyy')}">01/01/2026</span>.
                        <th:block th:if="${del.hasSeries()}">Os outros continuam lançados.</th:block>
                    </span>
                </button>
            </form>

            <form th:if="${del.offersFromHere()}" method="post"
                  th:action="@{/app/expenses/{id}/delete(id=${del.id()})}">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="scope" value="FROM_HERE">
                <input type="hidden" name="from" value="cards" th:if="${fromCards}">
                <button type="submit" class="acct-del-opt">
                    <span class="acct-del-opt-title">
                        <th:block th:if="${del.installment()}">Desta parcela em diante</th:block>
                        <th:block th:unless="${del.installment()}">Deste mês em diante</th:block>
                    </span>
                    <span class="acct-del-opt-sub">
                        Apaga <span th:text="${del.seriesFromHere()}">0</span> lançamento(s), de
                        <span th:text="${#temporals.format(del.dueDate(), 'MM/yyyy')}">01/2026</span>
                        para frente. Os anteriores ficam preservados.
                    </span>
                </button>
            </form>

            <form th:if="${del.hasSeries()}" method="post"
                  th:action="@{/app/expenses/{id}/delete(id=${del.id()})}">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="scope" value="ALL">
                <input type="hidden" name="from" value="cards" th:if="${fromCards}">
                <button type="submit" class="acct-del-opt is-danger">
                    <span class="acct-del-opt-title">
                        <th:block th:if="${del.installment()}">Todas as parcelas</th:block>
                        <th:block th:unless="${del.installment()}">Todos os meses</th:block>
                    </span>
                    <span class="acct-del-opt-sub">
                        <span>Apaga os <span th:text="${del.seriesTotal()}">0</span> lançamento(s) da série.</span>
                        Não dá para desfazer.
                    </span>
                </button>
            </form>
        </div>

        <div class="acct-del-foot">
            <!-- Aberto do detalhe da conta, "Cancelar" volta para o detalhe. -->
            <a th:if="${fromCards}" class="btn btn-ghost" data-modal-url
               th:href="@{/app/cards/{id}/detail(id=${del.accountId()}, ym=${#temporals.format(del.dueDate(), 'yyyy-MM')})}">Cancelar</a>
            <a th:unless="${fromCards}" class="btn btn-ghost" data-modal-close
               th:href="@{/app/expenses}">Cancelar</a>
        </div>
    </div>
</div>
</body>
</html>
