<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${editing ? 'Editar receita · Rastro$' : 'Nova receita · Rastro$'}">Receita · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/screens/income.css}">
</head>
<body>
<section class="app-content screen screen-income screen-income-form">
    <header class="screen-header">
        <div>
            <h1 class="screen-title"
                th:text="${editing ? 'Editar receita' : 'Nova receita'}">Nova receita</h1>
            <p class="screen-sub">Salário, freelas, vendas, dividendos…</p>
        </div>
        <div class="screen-actions">
            <a class="btn" th:href="@{/app/income}">Voltar</a>
        </div>
    </header>

    <form class="income-form card"
          th:action="${editing ? '/app/income/' + incomeId + '/edit' : '/app/income/new'}"
          method="post"
          th:object="${incomeForm}">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="income-form-grid">
            <div class="field field-wide">
                <label for="source">Fonte</label>
                <input id="source" type="text" th:field="*{source}"
                       maxlength="120" required autocomplete="off">
                <p class="field-error" th:if="${#fields.hasErrors('source')}"
                   th:errors="*{source}">erro</p>
            </div>

            <div class="field">
                <label for="amount">Valor (R$)</label>
                <input id="amount" type="number" step="0.01" min="0.01"
                       th:field="*{amount}" required>
                <p class="field-error" th:if="${#fields.hasErrors('amount')}"
                   th:errors="*{amount}">erro</p>
            </div>

            <div class="field">
                <label for="incomeDate">Data</label>
                <input id="incomeDate" type="date" th:field="*{incomeDate}" required>
                <p class="field-error" th:if="${#fields.hasErrors('incomeDate')}"
                   th:errors="*{incomeDate}">erro</p>
            </div>

            <div class="field">
                <label for="categoryId">Categoria (opcional)</label>
                <select id="categoryId" th:field="*{categoryId}">
                    <option value="">—</option>
                    <option th:each="c : ${categoryOptions}"
                            th:value="${c.id}"
                            th:text="${c.namePt}">Categoria</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('categoryId')}"
                   th:errors="*{categoryId}">erro</p>
            </div>

            <div class="field field-wide">
                <label for="note">Observação</label>
                <input id="note" type="text" th:field="*{note}"
                       maxlength="200" placeholder="ex.: bônus de fim de ano">
                <p class="field-error" th:if="${#fields.hasErrors('note')}"
                   th:errors="*{note}">erro</p>
            </div>
        </div>

        <footer class="income-form-foot">
            <button type="submit" class="btn btn-primary"
                    th:text="${editing ? 'Salvar' : 'Criar receita'}">Salvar</button>
        </footer>
    </form>
</section>
</body>
</html>
