<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout/base :: layout(~{::title}, ~{::head/link}, ~{::section}, ~{::head/script})}">
<head>
    <title th:text="${editing ? 'Editar receita · Rastro$' : 'Lançar receita · Rastro$'}">Receita · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/screens/income.css}">
</head>
<body>
<section class="app-content screen screen-income screen-income-form">
    <header class="screen-header">
        <div>
            <h1 class="screen-title"
                th:text="${editing ? 'Editar receita' : 'Lançar receita'}">Lançar receita</h1>
            <p class="screen-sub">Salário, freelas, vendas, dividendos…</p>
        </div>
        <div class="screen-actions">
            <a class="btn" th:href="@{/app/income}">Voltar</a>
        </div>
    </header>

    <form class="form income-form"
          th:action="${editing ? '/app/income/' + incomeId + '/edit' : '/app/income/new'}"
          method="post"
          th:object="${incomeForm}">
        <input type="hidden" th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label>
            <span>Origem</span>
            <input class="input" type="text" th:field="*{source}"
                   maxlength="120" required autocomplete="off" placeholder="Ex: Salário PJ">
            <small th:if="${#fields.hasErrors('source')}" th:errors="*{source}"
                   class="form-hint form-hint-err"></small>
        </label>

        <div class="form-row">
            <label>
                <span>Valor (R$)</span>
                <input class="input" type="number" step="0.01" min="0.01"
                       th:field="*{amount}" required placeholder="0,00">
                <small th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"
                       class="form-hint form-hint-err"></small>
            </label>
            <label>
                <span>Data</span>
                <input class="input" type="date" th:field="*{incomeDate}" required>
                <small th:if="${#fields.hasErrors('incomeDate')}" th:errors="*{incomeDate}"
                       class="form-hint form-hint-err"></small>
            </label>
        </div>

        <label>
            <span>Categoria</span>
            <div class="cat-grid" data-cat-grid>
                <button type="button" class="cat-btn" th:each="c : ${categoryOptions}"
                        th:attr="data-cat=${c.id},data-color=${c.colorHex}">
                    <span class="cat-dot"></span>
                    <span th:text="${c.namePt}">Categoria</span>
                </button>
            </div>
            <input type="hidden" th:field="*{categoryId}" data-cat-input>
            <small th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"
                   class="form-hint form-hint-err"></small>
        </label>

        <label>
            <span>Observação (opcional)</span>
            <input class="input" type="text" th:field="*{note}"
                   maxlength="200" placeholder="ex.: bônus de fim de ano">
        </label>

        <div class="form-actions">
            <a class="btn btn-ghost" data-modal-close th:href="@{/app/income}">Cancelar</a>
            <button type="submit" class="btn btn-primary"
                    th:text="${editing ? 'Salvar alterações' : 'Lançar receita'}">Lançar receita</button>
        </div>
    </form>
</section>
</body>
</html>
