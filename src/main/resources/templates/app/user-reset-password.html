<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resetar senha · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <script th:src="@{/js/auth-password.js}" defer></script>
</head>
<body>
<main class="auth-shell">
    <section class="auth-card">
        <h1 class="auth-title">Resetar senha</h1>

        <form th:action="@{/app/users/{id}/reset-password(id=${target.id()})}" method="post"
              th:object="${resetPasswordForm}" class="form" novalidate>
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <p class="auth-sub">
                Defina uma nova senha para <b th:text="${target.name()}">Usuário</b>.
                O usuário será desconectado e deverá trocá-la no próximo login.
            </p>
            <label>
                <span>Nova senha</span>
                <div class="auth-input-wrap">
                    <input class="input" type="password" th:field="*{newPassword}"
                           autocomplete="new-password" required minlength="8" maxlength="128">
                    <th:block th:replace="~{fragments/password-toggle :: pwdToggle}"></th:block>
                </div>
                <small class="form-hint">
                    Mínimo 8 caracteres, com maiúscula, minúscula, dígito e caractere especial.
                </small>
                <small th:if="${#fields.hasErrors('newPassword')}"
                       th:errors="*{newPassword}" class="form-hint form-hint-err"></small>
            </label>
            <label>
                <span>Confirmar nova senha</span>
                <div class="auth-input-wrap">
                    <input class="input" type="password" th:field="*{newPasswordConfirm}"
                           autocomplete="new-password" required minlength="8" maxlength="128">
                    <th:block th:replace="~{fragments/password-toggle :: pwdToggle}"></th:block>
                </div>
                <small th:if="${#fields.hasErrors('newPasswordConfirm')}"
                       th:errors="*{newPasswordConfirm}" class="form-hint form-hint-err"></small>
            </label>
            <div class="form-actions">
                <a class="btn btn-ghost" data-modal-close th:href="@{/app/users}">Cancelar</a>
                <button type="submit" class="btn btn-primary">Resetar senha</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
