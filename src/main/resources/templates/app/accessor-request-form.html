<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout/base :: layout(~{::title}, ~{::head/link}, ~{::section}, ~{::head/script})}">
<head>
    <title>Solicitar acessor · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/screens/accessors.css}">
</head>
<body>
<section class="app-content screen screen-accessors screen-accessor-request">
    <header class="screen-header">
        <div>
            <h1 class="screen-title">Solicitar acessor</h1>
            <p class="screen-sub">Um administrador criará a conta. O acessor poderá cadastrar, pagar e editar
                seus lançamentos, mas nunca excluir.</p>
        </div>
        <div class="screen-actions">
            <a class="btn" th:href="@{/app/accessors}">Voltar</a>
        </div>
    </header>

    <form class="form card" method="post" th:action="@{/app/accessors/request}" th:object="${requestForm}">
        <input type="hidden" th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-row">
            <label>
                <span>Nome do acessor</span>
                <input class="input" type="text" th:field="*{accessorName}"
                       maxlength="120" required autocomplete="off" placeholder="Ex: Maria Silva">
                <small th:if="${#fields.hasErrors('accessorName')}" th:errors="*{accessorName}" class="form-hint form-hint-err"></small>
            </label>
            <label>
                <span>Email do acessor</span>
                <input class="input" type="email" th:field="*{accessorEmail}"
                       maxlength="180" required autocomplete="off" placeholder="maria@email.com">
                <small th:if="${#fields.hasErrors('accessorEmail')}" th:errors="*{accessorEmail}" class="form-hint form-hint-err"></small>
            </label>
        </div>
        <label>
            <span>Observação (opcional)</span>
            <input class="input" type="text" th:field="*{note}" maxlength="500"
                   placeholder="Ex.: meu contador, minha esposa…">
            <small th:if="${#fields.hasErrors('note')}" th:errors="*{note}" class="form-hint form-hint-err"></small>
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Enviar solicitação</button>
        </div>
    </form>
</section>
</body>
</html>
