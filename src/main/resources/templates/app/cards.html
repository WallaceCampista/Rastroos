<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR"
      th:replace="~{layout/base :: layout(~{::title}, ~{::head/link}, ~{::section}, ~{::head/script})}">
<head>
    <title>Cartões &amp; Contas · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/screens/cards.css}">
    <script th:src="@{/js/screens/cards.js}" defer></script>
    <script th:src="@{/js/screens/cards-detail.js}" defer></script>
</head>
<body>
<section class="app-content screen screen-cards" th:data-period="${period}">

    <div th:if="${ok}" class="flash flash-ok" th:text="#{${ok}}">Operação concluída</div>
    <div th:if="${error}" class="flash flash-error" th:text="#{${error}}">Erro</div>

    <section class="dash-kpis" aria-label="Totais">
        <article class="kpi-card kpi-big">
            <div class="kpi-head"><span class="kpi-label">Total fixo</span><span class="kpi-icon kpi-icon-primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span></div>
            <p class="kpi-value money money-xl" th:data-amount="${maskValues ? '' : view.totalFixed()}"
               th:text="${maskValues ? '••••' : 'R$ ' + #numbers.formatDecimal(view.totalFixed(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
        </article>
        <article class="kpi-card">
            <div class="kpi-head"><span class="kpi-label">Total pago</span><span class="kpi-icon kpi-icon-success"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span></div>
            <p class="kpi-value money money-lg" th:data-amount="${maskValues ? '' : view.paidFixed()}"
               th:text="${maskValues ? '••••' : 'R$ ' + #numbers.formatDecimal(view.paidFixed(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
        </article>
        <article class="kpi-card kpi-accent kpi-big">
            <div class="kpi-head"><span class="kpi-label">Falta pagar</span><span class="kpi-icon kpi-icon-warn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2zm4 4a2 2 0 0 0 4 0"/></svg></span></div>
            <p class="kpi-value money money-xl" th:data-amount="${maskValues ? '' : view.remainingFixed()}"
               th:text="${maskValues ? '••••' : 'R$ ' + #numbers.formatDecimal(view.remainingFixed(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
        </article>
        <article class="kpi-card">
            <div class="kpi-head"><span class="kpi-label">Contas</span><span class="kpi-icon kpi-icon-primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v13H4V7zm0 0V5h16v2M8 3v4m8-4v4M4 11h16"/></svg></span></div>
            <p class="kpi-value money money-lg" th:text="${view.fixedCount()}">0</p>
        </article>
    </section>

    <div class="cards-actions" sec:authorize="!hasRole('ACESSOR')">
        <a class="btn btn-primary" data-modal-url th:href="@{/app/cards/new}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Nova conta
        </a>
    </div>

    <div class="cards-grid">
        <th:block th:each="a : ${view.cards()}">
            <th:block th:replace="~{fragments/card-tile :: tile(${a}, ${maskValues})}"></th:block>
        </th:block>
        <th:block th:each="a : ${view.bills()}">
            <th:block th:replace="~{fragments/card-tile :: tile(${a}, ${maskValues})}"></th:block>
        </th:block>
        <th:block th:each="a : ${view.recurrent()}">
            <th:block th:replace="~{fragments/card-tile :: tile(${a}, ${maskValues})}"></th:block>
        </th:block>
    </div>

    <!-- Detalhe da conta (carregado ao clicar num card, abre abaixo) -->
    <div class="account-detail-panel" data-account-detail hidden></div>

    <div class="empty-sm muted"
         th:if="${view.cards().isEmpty() and view.bills().isEmpty() and view.recurrent().isEmpty()}">
        Nenhuma conta cadastrada ainda.
    </div>

</section>
</body>
</html>
