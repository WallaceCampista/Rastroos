<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Gastos · Rastro$</title>
    <link rel="stylesheet" th:href="@{/css/screens/expenses.css}">
    <script th:src="@{/js/screens/expenses.js}" defer></script>
</head>
<body>
<section class="app-content screen screen-expenses"
         th:data-period="${period}">

    <header class="screen-header">
        <div>
            <h1 class="screen-title">Gastos</h1>
            <p class="screen-sub">
                <span th:text="${view.totalElements()}">0</span> lançamentos ·
                Total
                <strong th:text="${#numbers.formatDecimal(view.totalAmount(), 1, 'POINT', 2, 'COMMA')}">0,00</strong> ·
                Pago
                <strong th:text="${#numbers.formatDecimal(view.totalPaid(), 1, 'POINT', 2, 'COMMA')}">0,00</strong>
            </p>
        </div>
        <div class="screen-actions">
            <a class="btn btn-primary" th:href="@{/app/expenses/new}">+ Novo lançamento</a>
        </div>
    </header>

    <div th:if="${ok}" class="flash flash-ok" th:text="#{${ok}}">Ok</div>

    <form class="filter-bar" method="get" th:action="@{/app/expenses}">
        <input type="hidden" name="ym" th:value="${period}">

        <div class="filter-field">
            <label for="paid">Status</label>
            <select id="paid" name="paid">
                <option value="ALL"    th:selected="${filter.paid().name() == 'ALL'}">Todos</option>
                <option value="PAID"   th:selected="${filter.paid().name() == 'PAID'}">Pagos</option>
                <option value="UNPAID" th:selected="${filter.paid().name() == 'UNPAID'}">Em aberto</option>
            </select>
        </div>

        <div class="filter-field">
            <label for="fixed">Tipo</label>
            <select id="fixed" name="fixed">
                <option value="ALL"     th:selected="${filter.fixed().name() == 'ALL'}">Todos</option>
                <option value="FIXED"   th:selected="${filter.fixed().name() == 'FIXED'}">Fixos</option>
                <option value="ONE_OFF" th:selected="${filter.fixed().name() == 'ONE_OFF'}">Pontuais</option>
            </select>
        </div>

        <div class="filter-field">
            <label for="accountId">Conta</label>
            <select id="accountId" name="accountId">
                <option value="">Todas</option>
                <option th:each="a : ${accounts}"
                        th:value="${a.id}"
                        th:text="${a.name}"
                        th:selected="${filter.accountId() != null and filter.accountId() == a.id}">Conta</option>
            </select>
        </div>

        <div class="filter-field">
            <label for="categoryId">Categoria</label>
            <select id="categoryId" name="categoryId">
                <option value="">Todas</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.namePt}"
                        th:selected="${filter.categoryId() != null and filter.categoryId() == c.id}">Categoria</option>
            </select>
        </div>

        <div class="filter-field filter-field-grow">
            <label for="q">Busca</label>
            <input id="q" type="search" name="q"
                   th:value="${filter.search()}" placeholder="Descrição…">
        </div>

        <div class="filter-actions">
            <button type="submit" class="btn">Filtrar</button>
            <a class="btn-link" th:href="@{/app/expenses(ym=${period})}">Limpar</a>
        </div>
    </form>

    <div th:if="${view.items().isEmpty()}" class="empty-state">
        Nenhum lançamento encontrado neste período.
    </div>

    <table class="tx-table" th:unless="${view.items().isEmpty()}">
        <thead>
            <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Conta</th>
                <th>Categoria</th>
                <th class="num">Valor</th>
                <th class="actions">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${view.items()}"
                th:classappend="${t.paid()} ? 'tx-row-paid' : ''">
                <td>
                    <span th:text="${#temporals.format(t.dueDate(), 'dd/MM')}">--/--</span>
                </td>
                <td>
                    <div class="tx-desc">
                        <span th:text="${t.description()}">Lançamento</span>
                        <span th:if="${t.fixed()}" class="pill pill-accent">fixo</span>
                        <span th:if="${t.isInstallment()}" class="pill"
                              th:text="${t.installmentLabel()}">1/3</span>
                    </div>
                </td>
                <td>
                    <span class="tx-chip"
                          th:attr="data-stroke=${t.accountColorHex()}"
                          th:text="${t.accountName()}">Conta</span>
                </td>
                <td>
                    <span class="tx-chip"
                          th:attr="data-stroke=${t.categoryColorHex()}"
                          th:text="${t.categoryName()}">Categoria</span>
                </td>
                <td class="num">
                    <span class="tx-amount"
                          th:data-amount="${t.amount()}"
                          th:text="${#numbers.formatDecimal(t.amount(), 1, 'POINT', 2, 'COMMA')}">0,00</span>
                </td>
                <td class="actions">
                    <form class="inline-form"
                          th:action="@{/app/expenses/{id}/toggle-paid(id=${t.id()})}"
                          method="post">
                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <input type="hidden" name="redirect"
                               th:value="@{/app/expenses(ym=${period})}">
                        <button type="submit" class="btn-link"
                                th:text="${t.paid()} ? 'Reabrir' : 'Pagar'">Pagar</button>
                    </form>
                    <a class="btn-link"
                       th:href="@{/app/expenses/{id}/edit(id=${t.id()})}">Editar</a>
                    <form class="inline-form"
                          th:action="@{/app/expenses/{id}/delete(id=${t.id()})}"
                          method="post"
                          data-confirm="Remover este lançamento?">
                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <button type="submit" class="btn-link btn-link-danger">Remover</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <nav class="pagination" th:if="${view.totalPages() > 1}"
         aria-label="Paginação">
        <a class="btn-link"
           th:if="${view.page() > 0}"
           th:href="@{/app/expenses(ym=${period}, page=${view.page() - 1}, size=${view.size()},
                                    paid=${filter.paid()}, fixed=${filter.fixed()},
                                    accountId=${filter.accountId()}, categoryId=${filter.categoryId()},
                                    q=${filter.search()})}">← Anterior</a>
        <span class="pagination-info">
            Página <strong th:text="${view.page() + 1}">1</strong> de
            <strong th:text="${view.totalPages()}">1</strong>
        </span>
        <a class="btn-link"
           th:if="${view.page() + 1 < view.totalPages()}"
           th:href="@{/app/expenses(ym=${period}, page=${view.page() + 1}, size=${view.size()},
                                    paid=${filter.paid()}, fixed=${filter.fixed()},
                                    accountId=${filter.accountId()}, categoryId=${filter.categoryId()},
                                    q=${filter.search()})}">Próxima →</a>
    </nav>
</section>
</body>
</html>
